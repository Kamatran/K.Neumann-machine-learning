[project]
name = "mlproject"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "mlflow==3.16.0",
    "scikit-learn==1.8.0",
    "pandas==3.0.3",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
]

[dependency-groups]
# Jupyter kernel for notebooks/ (exploration and reading runs only) and pytest for exercise checks.
dev = ["ipykernel", "pytest==9.1.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# CPU-only PyTorch: the lab has no GPU, and the default wheels pull in several GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
